<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Roomie - Finanzas para Parejas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 500: '#7EA172', 600: '#68885E' },
                        slateWarm: { 700: '#2D4354', 800: '#1E2D38' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slateWarm-700 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- CONTENEDOR PRINCIPAL DE AUTENTICACIÓN -->
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gray-100 relative">
        
        <!-- LOGO -->
        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="bg-sage-500 text-white p-3 rounded-2xl shadow-md">
                <i data-lucide="heart-handshake" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="font-bold text-2xl text-slateWarm-700 leading-tight">My Roomie</h1>
                <p class="text-xs text-gray-400 font-medium">Gestión Financiera para Parejas</p>
            </div>
        </div>

        <!-- PESTAÑAS -->
        <div class="bg-gray-100 p-1 rounded-2xl flex gap-1 mb-6 text-xs font-bold">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-xl bg-white shadow-sm text-slateWarm-700 transition-all">Iniciar Sesión</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-xl text-gray-400 hover:text-slateWarm-700 transition-all">Registrar Pareja</button>
        </div>

        <!-- FORMULARIO 1: INICIAR SESIÓN PAREJA -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ID o Nombre de la Pareja</label>
                <input type="text" id="loginPairId" required placeholder="Ej: Sr-Sra" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-gray-600">Contraseña de Pareja</label>
                    <button type="button" onclick="showForgotPasswordModal()" class="text-[11px] font-bold text-sage-600 hover:underline">¿Olvidaste tu contraseña?</button>
                </div>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>

            <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-3 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Ingresar a Nuestro Espacio
            </button>
        </form>

        <!-- FORMULARIO 2: REGISTRAR PAREJA -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ID Único de Pareja</label>
                <input type="text" id="regPairId" required placeholder="Ej: Sr-Sra" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
                <input type="email" id="regEmail" required placeholder="ejemplo@correo.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre Pareja 1</label>
                    <input type="text" id="regUser1" required placeholder="Ej: Sr" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre Pareja 2</label>
                    <input type="text" id="regUser2" required placeholder="Ej: Sra" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Crear Contraseña Compartida</label>
                <input type="password" id="regPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>

            <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-3 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Crear Espacio de Pareja
            </button>
        </form>

        <!-- ACCESO DIRECTO AL PANEL DE ADMINISTRADOR -->
        <div class="mt-6 pt-4 border-t text-center">
            <button onclick="openAdminModal()" class="text-xs font-bold text-gray-400 hover:text-slateWarm-700 transition-all flex items-center justify-center gap-1 mx-auto">
                <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Panel Interno de Administrador
            </button>
        </div>

        <div id="authMsg" class="mt-4 text-center text-xs font-bold hidden"></div>
    </div>

    <!-- MODAL INGRESO ACCESO ADMIN CON CLAVE MAESTRA -->
    <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            <div class="flex items-center gap-2 mb-2">
                <i data-lucide="shield" class="w-5 h-5 text-slateWarm-700"></i>
                <h3 class="font-bold text-base text-slateWarm-700">Acceso Administradora</h3>
            </div>
            <p class="text-xs text-gray-400 mb-4">Introduce tus credenciales maestras para acceder al panel de control.</p>
            
            <form onsubmit="handleAdminLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Usuario Admin</label>
                    <input type="text" id="adminUser" required placeholder="Ingresa usuario admin" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-slateWarm-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Clave Maestra</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-slateWarm-700">
                </div>
                <button type="submit" class="w-full bg-slateWarm-700 hover:bg-slateWarm-800 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all">
                    Ingresar al Panel
                </button>
            </form>
            <div id="adminLoginMsg" class="mt-3 text-center text-xs font-bold hidden"></div>
        </div>
    </div>

    <!-- MODAL DE OLVIDÉ MI CONTRASEÑA -->
    <div id="forgotModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onclick="closeForgotModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="font-bold text-base text-slateWarm-700 mb-1">Recuperar Contraseña</h3>
            <p class="text-xs text-gray-400 mb-4">Ingresa el correo electrónico asociado a tu pareja y te enviaremos un enlace seguro.</p>
            
            <form onsubmit="handleForgotPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
                    <input type="email" id="forgotEmail" required placeholder="ejemplo@correo.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
                </div>
                <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all">
                    Enviar Enlace por Correo
                </button>
            </form>
            <div id="forgotMsg" class="mt-3 text-center text-xs font-bold hidden"></div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 py-2.5 rounded-xl bg-white shadow-sm text-slateWarm-700 transition-all";
                tabRegister.className = "flex-1 py-2.5 rounded-xl text-gray-400 hover:text-slateWarm-700 transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 py-2.5 rounded-xl bg-white shadow-sm text-slateWarm-700 transition-all";
                tabLogin.className = "flex-1 py-2.5 rounded-xl text-gray-400 hover:text-slateWarm-700 transition-all";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const pairId = document.getElementById('loginPairId').value;
            const password = document.getElementById('loginPassword').value;
            showMsg("Iniciando sesión...", "gray");

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pairId, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('myroomie_token', data.token);
                    localStorage.setItem('myroomie_pair', JSON.stringify(data.pair));
                    showMsg("¡Bienvenido/a!", "green");
                    setTimeout(() => window.location.href = '/dashboard.html', 1000);
                } else {
                    showMsg(data.msg || "Credenciales incorrectas", "red");
                }
            } catch (err) {
                showMsg("Error de conexión", "red");
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const pairId = document.getElementById('regPairId').value;
            const email = document.getElementById('regEmail').value;
            const user1 = document.getElementById('regUser1').value;
            const user2 = document.getElementById('regUser2').value;
            const password = document.getElementById('regPassword').value;

            showMsg("Registrando pareja...", "gray");

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pairId, email, user1, user2, password })
                });
                const data = await res.json();

                if (res.ok) {
                    showMsg("¡Cuenta creada con éxito! Ya puedes iniciar sesión.", "green");
                    setTimeout(() => switchTab('login'), 2000);
                } else {
                    showMsg(data.msg || "Error al registrar", "red");
                }
            } catch (err) {
                showMsg("Error de conexión", "red");
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const adminUser = document.getElementById('adminUser').value;
            const adminPassword = document.getElementById('adminPassword').value;
            const msgEl = document.getElementById('adminLoginMsg');
            
            msgEl.innerText = "Verificando...";
            msgEl.className = "mt-3 text-center text-xs font-bold text-gray-500";
            msgEl.classList.remove('hidden');

            try {
                const res = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminUser, adminPassword })
                });
                
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('myroomie_admin_token', data.token);
                    msgEl.innerText = "¡Acceso concedido! Redirigiendo...";
                    msgEl.className = "mt-3 text-center text-xs font-bold text-green-600";
                    setTimeout(() => window.location.href = '/admin.html', 1000);
                } else {
                    msgEl.innerText = data.msg || "Credenciales incorrectas";
                    msgEl.className = "mt-3 text-center text-xs font-bold text-red-500";
                }
            } catch (err) {
                console.error("Error en la solicitud fetch:", err);
                msgEl.innerText = "Error de conexión con el servidor";
                msgEl.className = "mt-3 text-center text-xs font-bold text-red-500";
            }
        }

        function showForgotPasswordModal() {
            document.getElementById('forgotModal').classList.remove('hidden');
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.add('hidden');
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const msgEl = document.getElementById('forgotMsg');
            msgEl.innerText = "Enviando correo...";
            msgEl.className = "mt-3 text-center text-xs font-bold text-gray-500";
            msgEl.classList.remove('hidden');

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msgEl.innerText = data.msg;
                msgEl.className = res.ok ? "mt-3 text-center text-xs font-bold text-green-600" : "mt-3 text-center text-xs font-bold text-red-500";
            } catch (err) {
                msgEl.innerText = "Error de conexión";
                msgEl.className = "mt-3 text-center text-xs font-bold text-red-500";
            }
        }

        function showMsg(text, color) {
            const el = document.getElementById('authMsg');
            el.innerText = text;
            el.className = `mt-4 text-center text-xs font-bold text-${color}-600`;
            el.classList.remove('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>
