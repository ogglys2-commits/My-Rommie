<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Roomie - Panel de Administración Interno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 500: '#7EA172', 600: '#68885E' },
                        slateWarm: { 700: '#2D4354', 800: '#1E2D38' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAF9F6] text-slateWarm-700 font-sans min-h-screen">

    <header class="bg-slateWarm-800 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-sage-500 p-2 rounded-xl">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg">My Roomie Admin</h1>
                    <p class="text-xs text-gray-400">Control de Usuarios y Soporte</p>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-xl font-semibold transition-all">
                Cerrar Sesión Admin
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">

        <!-- METRICAS DE PAREJAS -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Total Parejas</p>
                    <h3 class="text-2xl font-bold text-slateWarm-700 mt-1" id="totalPairs">0</h3>
                </div>
                <div class="bg-sage-50 text-sage-600 p-3 rounded-2xl"><i data-lucide="users" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Administradores</p>
                    <h3 class="text-2xl font-bold text-slateWarm-700 mt-1" id="totalAdmins">1</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-2xl"><i data-lucide="user-check" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Estado del Sistema</p>
                    <h3 class="text-xs font-bold text-green-600 mt-1">Conectado (Clave Maestra)</h3>
                </div>
                <div class="bg-green-50 text-green-600 p-3 rounded-2xl"><i data-lucide="shield" class="w-6 h-6"></i></div>
            </div>
        </div>

        <!-- TABLA DE PAREJAS REGISTRADAS -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-4 pb-3 border-b">
                <h2 class="font-bold text-sm text-slateWarm-700">Lista de Parejas Registradas</h2>
                <input type="text" id="adminSearch" onkeyup="filterPairs()" placeholder="🔍 Buscar por ID o correo..." class="w-full sm:w-64 bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:border-sage-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-50 text-gray-400 uppercase font-bold border-b">
                        <tr>
                            <th class="p-3">ID Pareja</th>
                            <th class="p-3">Integrantes</th>
                            <th class="p-3">Correo Electrónico</th>
                            <th class="p-3">Rol</th>
                            <th class="p-3 text-right">Acciones de Soporte</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y font-medium"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const adminToken = localStorage.getItem('myroomie_admin_token');

        if (!adminToken) {
            alert("Acceso denegado: Requiere autenticación de Administradora.");
            window.location.href = '/';
        }

        let allPairs = [];

        async function loadAdminData() {
            try {
                const res = await fetch('/api/auth/admin/pairs');
                if (!res.ok) throw new Error("Error en la consulta");
                
                allPairs = await res.json();
                renderAdminTable(allPairs);
            } catch (err) {
                alert("Error al cargar la lista de parejas.");
            }
        }

        function renderAdminTable(data) {
            const tbody = document.getElementById('adminTableBody');
            document.getElementById('totalPairs').innerText = data.length;

            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay parejas registradas aún.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 font-bold text-slateWarm-700">${p.pairId}</td>
                    <td class="p-3 text-gray-600">${p.user1} & ${p.user2}</td>
                    <td class="p-3 font-semibold text-sage-600">${p.email || 'Sin correo registrado'}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${p.role === 'admin' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600'}">${p.role}</span></td>
                    <td class="p-3 text-right">
                        <button onclick="sendRecoveryMail('${p.email}')" class="bg-sage-500 hover:bg-sage-600 text-white font-bold px-3 py-1 rounded-lg text-[10px] transition-all">
                            Enviar Correo Clave
                        </button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function filterPairs() {
            const query = document.getElementById('adminSearch').value.toLowerCase();
            const filtered = allPairs.filter(p => p.pairId.toLowerCase().includes(query) || (p.email && p.email.toLowerCase().includes(query)));
            renderAdminTable(filtered);
        }

        async function sendRecoveryMail(email) {
            if (!email) return alert("Esta pareja no tiene correo registrado.");
            if (confirm(`¿Enviar correo de recuperación a ${email}?`)) {
                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    alert(data.msg);
                } catch (err) {
                    alert("Error al enviar el correo");
                }
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('myroomie_admin_token');
            window.location.href = '/';
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
