<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Roomie - Restablecer Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: { 500: '#7EA172', 600: '#68885E' },
                        slateWarm: { 700: '#2D4354' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#FAF9F6] text-slateWarm-700 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-gray-100">
        <div class="text-center mb-6">
            <div class="inline-block bg-sage-500 text-white p-3 rounded-2xl mb-2">
                <i data-lucide="key-round" class="w-8 h-8"></i>
            </div>
            <h2 class="font-bold text-2xl">Nueva Contraseña</h2>
            <p class="text-xs text-gray-400 mt-1" id="pairLabel">Define tu clave de acceso</p>
        </div>

        <form id="resetForm" onsubmit="handleReset(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nueva Contraseña</label>
                <input type="password" id="newPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-sage-500">
            </div>

            <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-3 rounded-xl text-xs shadow-md transition-all">
                Actualizar Contraseña
            </button>
        </form>

        <div id="msg" class="mt-4 text-center text-xs font-bold hidden"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const pairId = urlParams.get('pairId');

        if (pairId) {
            document.getElementById('pairLabel').innerText = `Pareja: ${pairId}`;
        }

        async function handleReset(e) {
            e.preventDefault();
            const pass1 = document.getElementById('newPassword').value;
            const pass2 = document.getElementById('confirmPassword').value;
            const msgEl = document.getElementById('msg');

            if (pass1 !== pass2) {
                msgEl.innerText = 'Las contraseñas no coinciden';
                msgEl.className = 'mt-4 text-center text-xs font-bold text-red-500';
                msgEl.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, pairId, newPassword: pass1 })
                });

                const data = await res.json();

                if (res.ok) {
                    msgEl.innerText = data.msg;
                    msgEl.className = 'mt-4 text-center text-xs font-bold text-green-600';
                    msgEl.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/', 2500);
                } else {
                    msgEl.innerText = data.msg || 'Error al restablecer';
                    msgEl.className = 'mt-4 text-center text-xs font-bold text-red-500';
                    msgEl.classList.remove('hidden');
                }
            } catch (err) {
                msgEl.innerText = 'Error de conexión con el servidor';
                msgEl.className = 'mt-4 text-center text-xs font-bold text-red-500';
                msgEl.classList.remove('hidden');
            }
        }
        lucide.createIcons();
    </script>
</body>
</html>
